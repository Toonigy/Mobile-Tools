name: 🐛 Bug Report
description: Report a bug, syntax highlighting glitch, or mobile UI issue in PocketCode
title: "[Bug]: "
labels: ["bug", "triage"]
body:

type: markdown
attributes:
value: |
Thanks for taking the time to report an issue with PocketCode! Please fill out the details below so we can reproduce and fix it quickly.

type: textarea
id: description
attributes:
label: What happened?
description: A clear and concise description of the bug.
placeholder: e.g., When typing template literals in script.js on mobile Safari, the cursor jumps to the end of the line.
validations:
required: true

type: textarea
id: steps
attributes:
label: Steps to Reproduce
description: How can we trigger this issue?
value: |
1. Open PocketCode and select the '...' template
2. Switch to the '...' tab
3. Tap/type '...'
4. See error
validations:
required: true

type: textarea
id: expected
attributes:
label: Expected Behavior
description: What did you expect to happen instead?
validations:
required: true

type: dropdown
id: affected-area
attributes:
label: Affected Area
description: Which part of the editor is impacted?
options:
- Code Editor & Line Numbers
- Syntax Highlighting
- Mobile Quick-Symbol Toolbar
- Live Preview Sandbox (iframe)
- Console Drawer & Error Capturing
- Templates / Auto-Save / Export
- Responsive Layout / Mobile View Switcher
validations:
required: true

type: dropdown
id: device-type
attributes:
label: Device Type
options:
- Mobile (Phone)
- Tablet
- Desktop / Laptop
validations:
required: true

type: input
id: browser-os
attributes:
label: Browser & OS
description: Please specify your browser and operating system version.
placeholder: e.g., Safari on iOS 18, Chrome on Android 15, Firefox on Windows 11
validations:
required: true

type: textarea
id: code-snippet
attributes:
label: Minimal Code Snippet (Optional)
description: Paste any HTML, CSS, or JS snippet that triggers the bug.
render: html
