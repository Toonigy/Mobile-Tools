name: ✨ Feature Request
description: Suggest a new feature, mobile shortcut, or starter template for PocketCode
title: "[Feature]: "
labels: ["enhancement"]
body:

type: markdown
attributes:
value: |
Have an idea to make PocketCode even better on mobile or desktop? Share your proposal below!

type: dropdown
id: category
attributes:
label: Feature Category
options:
- Mobile Ergonomics / Symbol Toolbar
- Editor Experience (Shortcuts, Autocomplete, Themes)
- Preview & Console Capabilities
- New Starter Template
- Import / Export / Storage
- Other
validations:
required: true

type: textarea
id: problem
attributes:
label: Is your feature request related to a problem?
description: Describe the frustration or limitation you're experiencing.
placeholder: e.g., Writing CSS variables on a phone keyboard requires switching symbol layers multiple times for --.
validations:
required: true

type: textarea
id: solution
attributes:
label: Describe the solution you'd like
description: What should the feature look like and how should it behave?
placeholder: e.g., Add a -- button to the mobile quick-symbol toolbar when the style.css tab is active.
validations:
required: true

type: textarea
id: alternatives
attributes:
label: Alternatives Considered (Optional)
description: Any workarounds or alternative implementations you've thought about.
